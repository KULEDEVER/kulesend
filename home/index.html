<!doctype html>
<html>
<head>
    <meta charset="UTF-8">
    <title>KULESEND - Home</title>
</head>

<body>

<h2>KULESEND</h2>

<!-- USER SEARCH -->
<div>
    <h3>Start DM</h3>
    <input type="text" id="dmUsername" placeholder="username">
    <button id="startDM">Open Chat</button>
</div>

<hr>

<!-- GROUP SECTION -->
<div>
    <h3>Groups</h3>

    <input type="text" id="groupName" placeholder="group name">
    <button id="createGroup">Create Group</button>

    <div id="groupList"></div>
</div>

<hr>

<!-- CHAT AREA -->
<div id="chatHeader"></div>

<div id="chatBox"></div>

<input type="text" id="messageInput" placeholder="message">
<button id="sendBtn">Send</button>

<<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js"></script>

<script src="../script/script.js"></script>

</body>
</html>
